name: Simulator evidence
# The only check that reads the pull request description, so the only one
# that reruns when the description is edited.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: simulator-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    name: Require evidence for simulator changes
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require evidence for simulator changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          body_file="$RUNNER_TEMP/tessel-pr-body.txt"
          printf '%s' "$PR_BODY" > "$body_file"
          swift run tessel-check simulator-evidence --base "origin/$BASE_REF" --body-file "$body_file"
