name: Policy
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Deterministic policy
    runs-on: xcode-27
    # A green run takes about four minutes on xcode-27.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic tests
        run: swift test
      - name: Keep real-system tests out of the bare package
        run: swift run tessel-check layers
      - name: Repeat trace digest
        run: swift run tessel-check determinism --runs 3
