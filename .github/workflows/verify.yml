name: Permissions
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: permissions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  permissions:
    name: Permissions
    runs-on: xcode-27
    # ADR 0011: green runs took 216 to 381 s, and one with every step passed
    # was cancelled at seven minutes. Nine is the most the ten-minute rule allows.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral certificate signing
        timeout-minutes: 2
        run: scripts/ci-signing
      - name: Build signed bundles
        run: scripts/build
      - name: Grant Accessibility for the signed harness
        run: scripts/ci-accessibility
      - name: Signed rebuild preserves Accessibility; denial and restart recover
        run: scripts/verify signingAndPermission --permission
      - name: Remove ephemeral keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tessel-ci.keychain-db"
