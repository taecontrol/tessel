name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Acceptance
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral certificate signing
        timeout-minutes: 2
        run: scripts/ci-signing
      - name: Build signed bundles
        run: scripts/build
      - name: Verify permission denial and automatic restart
        run: scripts/verify --permission
      - name: Functional acceptance suite
        run: scripts/verify --functional
      - name: Resource acceptance suite (90 second budget)
        timeout-minutes: 2
        run: |
          SECONDS=0
          scripts/verify --resources
          echo "Resources suite elapsed: ${SECONDS} s (limit <= 90 s)"
          if (( SECONDS > 90 )); then
            echo "Resources suite exceeded the 90 second limit" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-calibration
          path: .work/switch-calibration.json
          if-no-files-found: ignore
      - name: Remove ephemeral keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tessel-ci.keychain-db"
